# PostgreSQL bağlantı URL'i
spring.datasource.url=jdbc:postgresql://localhost:5432/librarydb

# Veritabanı kullanıcı adı
spring.datasource.username=username

# Veritabanı şifresi
spring.datasource.password=password

# PostgreSQL JDBC sürücüsü
spring.datasource.driver-class-name=org.postgresql.Driver

# Bağlantı havuzu ayarları
spring.datasource.hikari.maximum-pool-size=10
# Bağlantı zaman aşımı (30 saniye)
spring.datasource.hikari.connection-timeout=30000
# Boşta bekleme süresi (10 dakika)
spring.datasource.hikari.idle-timeout=600000

# Tablo yönetimi stratejisi:
spring.jpa.hibernate.ddl-auto=update

# Hibernate'in ürettiği SQL sorgularını konsola yazar
spring.jpa.show-sql=true

# SQL sorgularını okunabilir formatta gösterir
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL diyalekti
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Lazy loading sorunlarını önlemek için Open Session in View kapatıldı
spring.jpa.open-in-view=false

# Batch insert/update — performans için
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Uygulamanın çalışacağı port
server.port=8080

# Hata detaylarını gösterir
server.error.include-message=always
server.error.include-binding-errors=always

# Token imzalama için gizli anahtar
jwt.secret=3d8f2a1b9c7e4f6a0d5b3c8e1a4f7d2b9e6c3a0f8d5b2e7c4a1f9d6b3e0c8a5

# Token geçerlilik süresi (millisecond)
jwt.expiration=86400000

# Google Books API anahtarı
google.books.api.key=key

# Google Books API URL'i
google.books.api.url=https://www.googleapis.com/books/v1/volumes

# Maksimum dosya boyutu
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Uygulama logları
logging.level.com.library=DEBUG

# SQL logları
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security logları
logging.level.org.springframework.security=INFO